openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Telegram bot status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get Telegram bot status
      responses:
        "200":
          description: Current bot process and wallet configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"
  /bot/pause:
    post:
      operationId: pauseBot
      tags: [bot]
      summary: Pause the bot strategy loop
      responses:
        "200":
          description: Updated bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"
  /bot/resume:
    post:
      operationId: resumeBot
      tags: [bot]
      summary: Resume the bot strategy loop
      responses:
        "200":
          description: Updated bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BotStatus:
      type: object
      properties:
        name:
          type: string
        process:
          type: string
          enum: [starting, running, stopped, error]
        mode:
          type: string
          enum: [paper, real]
        walletConfigured:
          type: boolean
        paused:
          type: boolean
        startedAt:
          type: [string, "null"]
        exitCode:
          type: [integer, "null"]
        lastError:
          type: [string, "null"]
      required:
        - name
        - process
        - mode
        - walletConfigured
        - paused
        - startedAt
        - exitCode
        - lastError

